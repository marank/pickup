[project]
name = "pickup-backend"
version = "0.1.0"
description = "Pickup backend (Django + DRF)"
requires-python = ">=3.14"
dependencies = [
    "django[argon2]>=6.1.2",
    "djangorestframework>=3.18.3",
    "drf-spectacular>=0.30.0",
    "gunicorn>=26.2.0",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.6",
]

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "django-stubs>=6.1.2",
    "djangorestframework-stubs>=3.18.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 110
target-version = "py314"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ", "SIM"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
