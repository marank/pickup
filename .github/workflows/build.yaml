# CI: check backend, frontend and the workflows through the justfile, scan the repository,
# then build the image, smoke-test it hardened like in production, scan it and push it to
# the GitHub container registry (ghcr.io/<owner>/<repo>). No secrets needed: the push uses
# the job's GITHUB_TOKEN. Every command a check runs lives in the justfile, so CI and
# `just check` cannot drift apart.
#
# Pull requests only run the checks and a test build. Pushes to main push `latest` and
# `sha-…`; version tags (v1.2.3, from release.yaml via workflow_call or by hand) also push
# 1.2.3, 1.2 and 1. Once a week main is rebuilt even without a change, so the image gets
# Debian's security fixes and a newly known vulnerability turns the run red.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  schedule:
    # Mondays 03:17 UTC (off the full hour, when GitHub's scheduler is busiest).
    - cron: "17 3 * * 1"
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Release version without "v" (e.g. 1.2.3); tags the image like a version tag
        type: string
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: true

# Nothing by default; each job asks for what it needs.
permissions: {}

env:
  # Started with `docker run` below; Dependabot does not see them. Bump TRIVY_IMAGE (tag and
  # digest) by hand, POSTGRES_IMAGE together with compose.yml.
  TRIVY_IMAGE: aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
  POSTGRES_IMAGE: postgres:18-alpine

jobs:
  # --- Backend: `just check-backend` and `just check-deploy` against PostgreSQL -----------
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_TYPE: postgres
      DB_HOST: localhost
      DB_NAME: ci
      DB_USER: ci
      DB_PASSWORD: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ffmpeg: the image builds a small one itself; tests take Debian's.
      # gettext: makemessages/compilemessages for the translations check.
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg gettext

      # Python comes from backend/.python-version, like natively. No caches: this workflow
      # also publishes the image, and a poisoned cache could reach it.
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false

      - name: Install just
        run: uv tool install rust-just==1.59.0

      # The tests run against PostgreSQL like production, with the local dev settings. Only
      # this step: uv's --env-file doesn't override variables, so the deploy check would
      # inherit it.
      - name: Checks and tests
        env:
          DEBUG: "true"
        run: just check-backend

      - name: Deploy checks
        run: just check-deploy

  # --- Frontend: `just check-frontend` ------------------------------------------------------
  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Install just
        run: uv tool install rust-just==1.59.0

      # pnpm in the version of packageManager in package.json (the one place it is set).
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false

      - name: Checks, tests, build
        run: just check-frontend

  # --- Workflows: `just check-workflows` (actionlint syntax, zizmor security audit) ----------
  workflows:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Install just
        run: uv tool install rust-just==1.59.0

      # With a token zizmor also runs its online audits (e.g. known-vulnerable actions).
      - name: Lint and audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: just check-workflows

  # --- End of support: `just check-eol`, only in the weekly run ----------------------------
  # Updates Dependabot ignores (PostgreSQL majors) or doesn't offer (base image majors) come
  # up here: the run turns red 180 days before a platform's support ends. Not a dependency of
  # `image` and not a required check, so it never blocks the rebuild or a pull request.
  eol:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Install just
        run: uv tool install rust-just==1.59.0

      - name: Check
        run: just check-eol

  # --- Repository: committed secrets, vulnerable lock files, Dockerfile/compose ----
  repository:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Secrets, critical fixable vulnerabilities and Dockerfile/compose misconfigurations
      # fail; HIGH vulnerabilities are reported. The files are streamed into the scanner
      # as a tar archive, so it sees exactly the checkout without .git and dependencies.
      - name: Scan
        run: |
          trivy() {
            tar -c --exclude=.git --exclude=node_modules --exclude=.venv . \
              | docker run --rm -i -v trivy-cache:/root/.cache/trivy \
                  --entrypoint sh "$TRIVY_IMAGE" -c \
                  'mkdir /src && tar -x -C /src &&
                   test -f /src/Dockerfile -a -f /src/backend/uv.lock || { echo "nothing to scan" >&2; exit 2; }
                   exec trivy fs --no-progress --skip-version-check "$@" /src' \
                  trivy "$@"
          }
          trivy --scanners secret --exit-code 1
          trivy --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1
          trivy --scanners misconfig --severity HIGH,CRITICAL --exit-code 1
          trivy --scanners vuln --severity HIGH

  # --- Image: build, smoke-test, scan, push ---------------------------------------
  image:
    needs: [backend, frontend, workflows, repository]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DOCKER_BUILDKIT: "1"
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute tags
        id: meta
        # Context values go in via env, never straight into the script: tag names
        # may contain shell metacharacters.
        env:
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          # Set when release.yaml calls this workflow for a new release.
          RELEASE: ${{ inputs.version }}
        run: |
          REGISTRY=ghcr.io
          if [ -n "$RELEASE" ]; then REF="refs/tags/v$RELEASE"; REF_NAME="v$RELEASE"; fi
          IMAGE=$(echo "$REGISTRY/$REPO" | tr '[:upper:]' '[:lower:]')
          SHORT_SHA=$(echo "$SHA" | cut -c1-12)
          TAGS="$IMAGE:sha-$SHORT_SHA"
          case "$REF" in
            refs/heads/main)
              TAGS="$TAGS $IMAGE:latest"
              ;;
            refs/tags/v*)
              VERSION="${REF_NAME#v}"
              # Only docker-safe tag names; the tags end up in later scripts.
              if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
                echo "Invalid version tag: $REF_NAME" >&2
                exit 1
              fi
              TAGS="$TAGS $IMAGE:$VERSION"
              # Also tag 1.2 and 1 for plain releases (no -rc/-beta suffix).
              if echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
                TAGS="$TAGS $IMAGE:${VERSION%.*} $IMAGE:${VERSION%%.*}"
              fi
              ;;
          esac
          {
            echo "registry=$REGISTRY"
            echo "image=$IMAGE"
            echo "ref=$IMAGE:sha-$SHORT_SHA"
            echo "tags=$TAGS"
          } >> "$GITHUB_OUTPUT"
          echo "Tags: $TAGS"

      - name: Login
        if: env.PUSH == 'true'
        env:
          REGISTRY: ${{ steps.meta.outputs.registry }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$REGISTRY_TOKEN" | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin

      - name: Build
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          read -ra tag_list <<< "$IMAGE_TAGS"
          tag_args=()
          for t in "${tag_list[@]}"; do tag_args+=(-t "$t"); done
          # Reuse layers from the last pushed image when there is one.
          docker pull "$IMAGE:latest" || true
          docker build --pull \
            --cache-from "$IMAGE:latest" \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            --label "org.opencontainers.image.source=$SOURCE" \
            --label "org.opencontainers.image.revision=$SHA" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "${tag_args[@]}" .

      # Start the image against a throwaway PostgreSQL, hardened like compose.yml
      # (read-only, no capabilities), so an image that cannot boot is never pushed.
      # Then check that it stays up, that nginx serves the SPA, static files and the API,
      # that /admin is closed and nothing runs as root. A program that keeps failing
      # stops the container (docker/exit-on-fatal), which this catches too.
      # TRUSTED_PROXIES=127.0.0.1 lets the probes act like a TLS proxy in front, so the
      # https APP_URLS behave as in production.
      - name: Smoke test
        env:
          IMAGE: ${{ steps.meta.outputs.ref }}
          RUN_ID: ${{ github.run_id }}
        run: |
          NAME="smoke-$RUN_ID"
          docker network create "$NAME"
          trap 'docker logs "$NAME" || true; docker rm -f "$NAME" "$NAME-db" >/dev/null 2>&1 || true; docker volume rm "$NAME-data" >/dev/null 2>&1 || true; docker network rm "$NAME" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$NAME-db" --network "$NAME" --network-alias db \
            -e POSTGRES_DB=ci -e POSTGRES_USER=ci -e POSTGRES_PASSWORD=ci \
            "$POSTGRES_IMAGE"
          docker run -d --name "$NAME" --network "$NAME" \
            --read-only --tmpfs /tmp -v "$NAME-data:/data" \
            --security-opt no-new-privileges:true --cap-drop ALL \
            -e SECRET_KEY=ci-smoke-test-not-secret-but-long-enough-for-the-check-0123456789 \
            -e EMAIL_HASH_KEY=ci-smoke-test-email-hash-key-0123456789abcdef \
            -e APP_URLS=https://app.example.com -e TRUSTED_PROXIES=127.0.0.1 \
            -e DB_TYPE=postgres -e DB_HOST=db -e DB_NAME=ci -e DB_USER=ci -e DB_PASSWORD=ci \
            -e ADMIN_USERNAME=admin -e ADMIN_EMAIL=admin@example.com \
            -e ADMIN_PASSWORD=ci-smoke-admin-password-42 \
            "$IMAGE"

          probe() { docker exec "$NAME" python /usr/local/bin/healthcheck "$@"; }

          healthy=false
          for i in $(seq 1 45); do
            if probe /api/health 200 >/dev/null 2>&1; then
              echo "Healthy after ${i}x2s"; healthy=true; break
            fi
            sleep 2
          done
          if [ "$healthy" != true ]; then
            echo "Container did not become healthy" >&2
            exit 1
          fi

          # Long enough for supervisord to give up on a crashing program.
          sleep 20
          probe /api/health 200
          probe / 200
          probe /some/client/route 200
          probe /django-static/admin/css/base.css 200
          probe /admin/ 404
          probe /api/pickups/00000000-0000-4000-8000-000000000000/ 404
          probe /protected-media/x 404
          probe /api/files/00000000-0000-4000-8000-000000000000/ 404
          docker exec "$NAME" supervisorctl -c /etc/supervisord.conf status
          if docker exec "$NAME" supervisorctl -c /etc/supervisord.conf status | grep -v RUNNING; then
            echo "Not all programs are running" >&2
            exit 1
          fi
          docker logs "$NAME" 2>&1 | grep -q "Created admin user 'admin'"
          docker exec "$NAME" sh -c 'test "$(id -u)" != 0 && mkdir -p /data/.probe && rmdir /data/.probe'
          if docker exec "$NAME" sh -c 'touch /app/.probe' 2>/dev/null; then
            echo "Root filesystem is writable" >&2
            exit 1
          fi
          if docker exec "$NAME" sh -c "grep -l '^Uid:[[:space:]]0' /proc/[0-9]*/status" 2>/dev/null; then
            echo "A process runs as root" >&2
            exit 1
          fi
          echo "Image boots hardened, serves SPA, API and static files"

      # Known vulnerabilities (OS packages, Python wheels) and secrets baked into the image.
      # Critical fixable ones block the push; HIGH is reported. The image is streamed into
      # the scanner with docker save, so it needs neither the Docker socket nor a path.
      - name: Vulnerability scan
        env:
          IMAGE: ${{ steps.meta.outputs.ref }}
        run: |
          trivy() {
            docker save "$IMAGE" \
              | docker run --rm -i -v trivy-cache:/root/.cache/trivy \
                  --entrypoint sh "$TRIVY_IMAGE" -c \
                  'cat > /tmp/image.tar &&
                   exec trivy image --no-progress --skip-version-check --ignore-unfixed \
                     --input /tmp/image.tar "$@"' \
                  trivy "$@"
          }
          trivy --scanners vuln,secret --severity CRITICAL --exit-code 1
          trivy --scanners vuln --severity HIGH

      - name: Push
        if: env.PUSH == 'true'
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          read -ra tag_list <<< "$IMAGE_TAGS"
          for t in "${tag_list[@]}"; do docker push "$t"; done

      - name: Logout
        if: always() && env.PUSH == 'true'
        env:
          REGISTRY: ${{ steps.meta.outputs.registry }}
        run: docker logout "$REGISTRY"
