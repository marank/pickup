# Fast checks before each commit; the full set is the VS Code `check` task (and CI).
# Install once: uv tool run pre-commit install
# Generated files must stay exactly as generated (CI compares them).
exclude: ^frontend/(openapi\.json|src/api/schema\.d\.ts)$
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]  # pnpm-lock.yaml has several
      - id: check-json
        exclude: ^(\.vscode/|frontend/tsconfig.*\.json$)  # JSON with comments
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: local
    hooks:
      - id: frontend-format
        name: prettier (frontend)
        language: system
        entry: bash -c 'cd frontend && pnpm exec prettier --write --ignore-unknown "${@#frontend/}"' --
        files: ^frontend/
      - id: frontend-oxlint
        name: oxlint (frontend)
        language: system
        entry: bash -c 'cd frontend && pnpm exec oxlint "${@#frontend/}"' --
        files: ^frontend/src/.*\.(ts|vue)$
