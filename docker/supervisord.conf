; supervisord runs as PID 1 and keeps gunicorn and nginx running. Everything runs as the
; unprivileged "app" user (see Dockerfile); runtime files live in /tmp.
; If a program keeps failing, exit-on-fatal stops supervisord and with it the container,
; so Docker's restart policy can take over.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

; For `supervisorctl status` inside the container. supervisord logs a CRIT notice that it
; has no password; only "app" may open the socket (chmod 0700), which is enough here.
[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:gunicorn]
; Deploy checks, migrations and the first admin are brought up to date right before the
; server starts. Workers: GUNICORN_WORKERS, default 3. GUNICORN_TIMEOUT (default 300 s)
; must cover finalizing the largest chunked upload (nginx uses the same value). No access
; log: nginx logs every request once, with the response time.
command=/bin/sh -c 'python manage.py check --deploy --fail-level ERROR && python manage.py migrate --noinput && python manage.py ensure_admin && exec gunicorn config.wsgi:application --bind 127.0.0.1:8000 --workers ${GUNICORN_WORKERS:-3} --timeout ${GUNICORN_TIMEOUT:-300} --no-control-socket --worker-tmp-dir /tmp --forwarded-allow-ips 127.0.0.1'
directory=/app
priority=10
startsecs=5
startretries=3
autorestart=true
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nginx]
command=/bin/sh /usr/local/bin/start-nginx
priority=20
startsecs=2
startretries=3
autorestart=true
stopsignal=QUIT
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:expiry]
; Deletes pickups whose expiry date has passed (with their files), once an hour. The first run
; waits a minute, so gunicorn's migrate has finished. Expired pickups are hidden by the API
; right away; this only frees the space. Stopping signals the whole group, sleep included.
command=/bin/sh -c 'sleep 60; while true; do python manage.py delete_expired_pickups; sleep 3600; done'
directory=/app
priority=30
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[eventlistener:exit-on-fatal]
command=python3 /usr/local/bin/exit-on-fatal
events=PROCESS_STATE_FATAL
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
