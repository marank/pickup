<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#083230" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pickup</title>
    <meta name="description" content="Everyone’s photos and videos from one event in one place. One link, no accounts." />
    <!-- Pickup links are private: no search engines. For a pickup's pages, Django fills in its
         title and creator for link previews (WhatsApp, Signal, …; services/link_preview.py),
         keep these tags as they are. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pickup" />
    <meta property="og:title" content="Pickup" />
    <meta property="og:description" content="Everyone’s photos and videos from one event in one place. One link, no accounts." />
  </head>

    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
