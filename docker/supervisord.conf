; supervisord runs as PID 1 (started by docker/start after the migrations) and keeps gunicorn,
; nginx and the job worker running. Everything runs as the unprivileged "app" user (see
; Dockerfile); runtime files live in /tmp.
; If a program keeps failing, exit-on-fatal stops supervisord and with it the container,
; so Docker's restart policy can take over.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

; For `supervisorctl status` inside the container. supervisord logs a CRIT notice that it
; has no password; only "app" may open the socket (chmod 0700), which is enough here.
[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:gunicorn]
; docker/start has brought the database up to date before supervisord runs. Workers:
; GUNICORN_WORKERS, default 3, each with GUNICORN_THREADS threads (default 8), so a long ZIP
; download doesn't block a whole worker. GUNICORN_TIMEOUT (default 300 s) must cover finalizing
; the largest chunked upload (nginx uses the same value). No access log: nginx logs every
; request once, with the response time.
command=/bin/sh -c 'exec gunicorn config.wsgi:application --bind 127.0.0.1:8000 --workers ${GUNICORN_WORKERS:-3} --worker-class gthread --threads ${GUNICORN_THREADS:-8} --timeout ${GUNICORN_TIMEOUT:-300} --no-control-socket --worker-tmp-dir /tmp --forwarded-allow-ips 127.0.0.1'
directory=/app
priority=10
startsecs=5
startretries=3
autorestart=true
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nginx]
command=/bin/sh /usr/local/bin/start-nginx
priority=20
startsecs=2
startretries=3
autorestart=true
stopsignal=QUIT
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:worker]
; Background jobs from the queue in Postgres (backend/apps/pickups/tasks.py): mails with
; retries, the hourly cleanup of expired pickups, catching up on previews, fingerprints and
; capture times every 10 minutes. Every job is small: on stop the running ones get 4 s to
; finish (ffmpeg goes with the group), anything left over is caught up on later.
command=python manage.py procrastinate worker --shutdown-graceful-timeout 4
directory=/app
priority=30
startsecs=5
startretries=3
autorestart=true
stopsignal=TERM
stopwaitsecs=8
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[eventlistener:exit-on-fatal]
command=python3 /usr/local/bin/exit-on-fatal
events=PROCESS_STATE_FATAL
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
