# Nginx configuration for Pickup app in production
# Supports very large file uploads (10s of GB) via chunked upload

upstream pickup_backend {
    server 127.0.0.1:8000;
}

upstream pickup_frontend {
    server 127.0.0.1:3000;
}

server {
    listen 80;
    server_name pickup.example.com;

    client_max_body_size 0;          # Disable nginx body size limit (Django handles chunks)
    proxy_request_buffering off;     # Stream request directly to backend (essential for large uploads)
    proxy_buffering off;               # Stream response directly to client
    proxy_read_timeout 600s;           # Allow long-running uploads
    proxy_send_timeout 600s;
    proxy_connect_timeout 60s;

    # Frontend static files
    location / {
        proxy_pass http://pickup_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API
    location /api/ {
        proxy_pass http://pickup_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Create pickup endpoint
    location /create-pickup/ {
        proxy_pass http://pickup_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check endpoint
    location /health/ {
        proxy_pass http://pickup_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Media files
    location /media/ {
        alias /path/to/backend/media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Static files
    location /static/ {
        alias /path/to/backend/staticfiles/;
        expires 30d;
    }
}
